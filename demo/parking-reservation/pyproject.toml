[project]
name = "parking-reservation"
version = "0.1.0"
description = "Garage spot reservations with check-in, check-out and billing notices"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["emulator: needs the Pub/Sub emulator (PUBSUB_EMULATOR_HOST)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["parking_reservation"]
