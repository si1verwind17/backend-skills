[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-reservation"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "google-cloud-pubsub==2.43.0",
    "google-auth==2.62.0",
    "requests==2.34.2",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "mypy==2.4.0",
    "ruff==0.17.1",
    "pip-tools==7.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parking_reservation = ["repo/sql/*.sql", "sys/sql/*.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: needs the Postgres test container (Docker)"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src:tests"
explicit_package_bases = true

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["parking_reservation", "testkit"]

[[tool.mypy.overrides]]
module = ["tests.*", "unit.*", "stubbed.*", "integration.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false

# Google's client libraries ship partial type information; only the two adapter modules touch them.
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["parking_reservation.sys.google_scheduler_verifier", "parking_reservation.sys.pubsub_event_publisher"]
disallow_untyped_calls = false
warn_return_any = false
