name: pages
on:
  push:
    branches: [main]
    paths: ["demo/parking-reservation/docs/backend-design/design-review.html", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # the site: the demo's design-review page at /demo/; / redirects there
      - run: |
          mkdir -p site/demo
          cp demo/parking-reservation/docs/backend-design/design-review.html site/demo/index.html
          printf '<!doctype html><meta charset="utf-8"><title>backend-skills</title><meta http-equiv="refresh" content="0; url=demo/"><a href="demo/">Demo design review</a>\n' > site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
